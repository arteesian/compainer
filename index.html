<!-- frontend/index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Internal App (SPA)</title>
  <link rel="stylesheet" href="style/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="wrap">
    <div class="window-auth glow-border">
      <div class="window-login">
        <img src="style/img/pari_logo.png" alt="pari-logo" class="pari-logo">

        <!-- Экран входа -->
        <div id="login-screen">
          <p>Пожалуйста, войдите в систему</p>
          <button onclick="login()" class="button-loggin"><b>Войти</b></button>
          <p id="error" class="hidden"></p>
        </div>

        <!-- Экран профиля -->
        <div id="profile-screen" class="hidden">
          <p>Вы вошли как: <strong id="user-email"></strong>
            <span id="user-role" class="role-user"></span>
          </p>
          <button onclick="logout()">Выйти</button>
          <br><br>
          <div id="admin-btn" class="hidden">
            <button onclick="openAdmin()">Админские функции</button>
          </div>
        </div>

        <!-- Экран админки -->
        <div id="admin-screen" class="hidden">
          <h2>Админка</h2>
          <p id="admin-message"></p>
          <button onclick="backToProfile()">Назад</button>
        </div>
      </div>
    </div>
  </div>


  <script src="script.js"></script>
</body>
</html>
