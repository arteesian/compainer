<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Авторизейшн</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/baby_black.png">
  <script>window.CURRENT_USER = { role: "{{ role|e }}" };</script>
</head>
<body>
  <div class="wrap">
    <div class="window-auth glow-border">
      <div class="window-login">

        <img src="static/img/pari_logo.png" alt="pari-logo" class="pari-logo">

        <!-- Экран входа -->
        <div id="login-screen">
          <p>Пожалуйста, войдите в систему</p>
          <button onclick="login()" class="button-loggin"><b>Войти</b></button>
          <p id="error"></p>
        </div>
        <div id="profile-screen">
          <p>Вы вошли как: <strong id="user-email"></strong> | 
            <span id="user-role" class="role-user"></span>
          </p>
          <div class="buttons-profile-screen">
            <button id="button-to-campeiner">Кампейнер</button>
            <button id="button-profile-logout" onclick="logout()">Выйти</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script defer src="{{ url_for('static', path='scriptAUTH.js') }}?v=12"></script>
</body>
</html>
