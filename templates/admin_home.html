<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Главная</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/pari_logo_comp_admin.png">
    <script>window.CURRENT_USER = { role: "{{ role|e }}" };</script>
  </head>
  <body>
    <div class="wrap">
      <div class="admin-background">
        <div class="container">
          <div class="navigation-panel">
            <div class="navigation-buttons">
              <button class="general-actions active-page-admin">Общие акции</button>
              <button class="personal-actions" id="personal-actions">Персональные акции</button>
              <button class="" id="qa-approving"><img src="/static/img/icon_notif_empty.png" alt="notif"></button>
            </div>
            <div class="profile-panel">
              <button class="profile-button-admin"><span class="profile-icon"></span></button>
              <div class="profile-menu hidden" id="profile-menu">
                <button class="profile-menu-item" id="profile-admin">Выйти из админки</button>
                <button class="profile-menu-item" id="profile-logout">Выйти из профиля</button>
              </div>
              <button id="btn-superadmin" class="hidden">SUPER-ADMIN</button>
            </div>
          </div>
          <div class="general-actions-panel">
            <div class="general-actions-top-bar">
              <div class="general-actions-top-bar-left-side">
                <div class="general-actions-top-bar-left-side-title">Общие акции</div>
                <div class="general-actions-top-bar-left-side-search">
                  <form class="searchbar" action="/search" method="get" role="search">
                    <span class="search-icon" aria-hidden="true"><img src="/static/img/search_icon.png" alt="search-icon"></span>
                    <input id="q" name="q" type="search" placeholder="Найти акцию…" autocomplete="off">
                  </form>
                </div>
                 <button type="button" class="ga-add-action" style="margin-left:12px;">+ Добавить акцию</button>
                <button type="button" class="ga-bulk-delete hidden" style="margin-left:12px;">Удалить акции(-ю)</button>
              </div>
              
              <div class="general-actions-top-bar-right-side"></div>
            </div>
            <div class="general-actions-columns">
              <div class="ga-col-check">
                <input type="checkbox" class="ga-master-check" title="Выбрать всё" />
              </div>
              <div class="general-actions-columns-name">Название</div>
              <div class="general-actions-columns-macros">Ответ клиенту</div>
              <div class="general-actions-columns-time">Сроки проведения</div>
              <div class="general-actions-columns-rules">Краткое описание акции</div>
              <div class="general-actions-columns-list">Список участников/победителей</div>
              <div class="general-actions-columns-faq">FAQ</div>
              <div class="general-actions-columns-status">Статус</div>
            </div>
            <div class="general-actions-table">

            </div>
          </div>
          <div class="general-actions-pagination">
            <div class="general-actions-pagination-quantity-of-pages">
              <span class="quantity-of-pages-text">Количество акций на странице:</span>
              <div class="quantity-of-pages-list">
                <button type="button" class="quantity-of-pages-button"></button>
                <ul class="quantity-of-pages-roll" hidden>
                  <li class="amount-of-pages-selected">10</li>
                  <li>30</li>
                  <li>50</li>
                </ul>
                <input type="hidden" class="amount-of-pages-value" name="myValue" value="1">
              </div>
            </div>
            <div class="general-actions-pagination-arrows">
              <button class="pagination-arrow-left"><img src="/static/img/arrow_left_enable.png" alt="arrow_left"></button>
              <button class="pagination-arrow-right"><img src="/static/img/arrow_right_enable.png" alt="arrow_right"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script defer src="{{ url_for('static', path='scriptHOMEADMIN.js') }}?v=12"></script>
    <script defer src="{{ url_for('static', path='scriptACTIONSADMIN.js') }}?v=1"></script>
    <script defer src="{{ url_for('static', path='scriptGENACTIONSLISTADMIN.js') }}?v=13"></script>
  </body>
</html>
