<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Персональные акции</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/baby_black.png">
    <script>window.CURRENT_USER = { role: "{{ role|e }}" };</script>
  </head>
  <body>
    <div class="wrap">
      <div class="user-background">
        <div class="container">
          <div class="navigation-panel">
            <div class="navigation-buttons">
              <button class="general-actions" id="general-actions">Общие акции</button>
              <button class="personal-actions active-page">Персональные акции</button>
              <button class="bonus-wager" id="bonus-wager">Отыгрыш бонуса</button>
              <button class="events-smm">Конкурсы в соцсетях</button>
              <button class="tablo" id="tablo">Табло</button>
            </div>
            <div class="profile-panel">
              <button class="profile-button"><span class="profile-icon"></span></button>
              <div class="profile-menu hidden" id="profile-menu">
                <button class="profile-menu-item hidden" id="profile-admin">Администрирование</button>
                <button class="profile-menu-item" id="profile-logout">Выйти из профиля</button>
              </div>
              <button id="btn-superadmin" class="hidden">SUPER-ADMIN</button>
            </div>
          </div>
          <div class="general-actions-panel">
            <div class="general-actions-top-bar">
              <div class="general-actions-top-bar-left-side">
                <div class="general-actions-top-bar-left-side-title">Персональные акции</div>
                <div class="general-actions-top-bar-left-side-search">
                  <form class="personal-searchbar" action="/search" method="get" role="search">
                    <span class="personal-search-icon" aria-hidden="true"><img src="/static/img/search_icon.png" alt="search-icon"></span>
                    <input id="q" name="q" type="search" placeholder="Введите ID клиента и нажмите Enter" autocomplete="off">
                  </form>
                </div>
                <div class="personal-actions-bad-client"><button id="personal-actions-bad-client">• Негативный статус</button></div>
              </div>
              <div class="general-actions-top-bar-right-side">1-10 из 14</div>
            </div>
            <div class="general-actions-columns">
              <div class="general-actions-columns-name">Название акции</div>
              <div class="general-actions-columns-macros">Макросы</div>
              <div class="general-actions-columns-time">Сроки проведения</div>
              <div class="general-actions-columns-rules">Правила</div>
              <div class="general-actions-columns-list">Краткое описание акции</div>
              <div class="general-actions-columns-status">Статус</div>
            </div>
            <div class="general-actions-table">
              <div class="general-actions-table-row">
                <div class="general-actions-table-cell-name">Заработай тугрики</div>
                <div class="general-actions-table-cell-macros"><button class="macros"><img src="/static/img/macros_img.png" alt="macros"></button></div>
                <div class="general-actions-table-cell-time">25.08.2025 - 01.09.2025</div>
                <div class="general-actions-table-cell-rules"><button class="regular-action-rules">Правила акции</button></div>
                <div class="general-actions-table-cell-list"></div>
                <div class="general-actions-table-cell-status"><button class="general-action-status" id="general-action-status-ended">• Завершена</button></div>
              </div>
              <div class="general-actions-table-row">
                <div class="general-actions-table-cell-name">Паримания</div>
                <div class="general-actions-table-cell-macros"><button class="macros"><img src="/static/img/macros_img.png" alt="macros"></button></div>
                <div class="general-actions-table-cell-time">05.09.2025 - 27.12.2025</div>
                <div class="general-actions-table-cell-rules"><button class="regular-action-rules">Правила акции</button></div>
                <div class="general-actions-table-cell-list"></div>
                <div class="general-actions-table-cell-status"><button class="general-action-status" id="general-action-status-active">• Активна</button></div>
              </div>
              <div class="general-actions-table-row">
                <div class="general-actions-table-cell-name">BOTIK</div>
                <div class="general-actions-table-cell-macros"><button class="macros"><img src="/static/img/macros_img.png" alt="macros"></button></div>
                <div class="general-actions-table-cell-time">01.01.2025 - 52.12.2025</div>
                <div class="general-actions-table-cell-rules"><button class="regular-action-rules">Полные правила</button></div>
                <div class="general-actions-table-cell-list">Описание</div>
                <div class="general-actions-table-cell-status"><button class="general-action-status" id="general-action-status-unavailable">• Недоступна</button></div>
              </div>
            </div>
          </div>
          <div class="general-actions-pagination">
            <div class="general-actions-pagination-quantity-of-pages">
              <span class="quantity-of-pages-text">Количество акций на странице:</span>
              <div class="quantity-of-pages-list">
                <button type="button" class="quantity-of-pages-button"></button>
                <ul class="quantity-of-pages-roll" hidden>
                  <li class="amount-of-pages-selected">10</li>
                  <li>30</li>
                  <li>50</li>
                </ul>
                <input type="hidden" class="amount-of-pages-value" name="myValue" value="1">
              </div>
            </div>
            <div class="general-actions-pagination-arrows">
              <button class="pagination-arrow-left"><img src="/static/img/arrow_left_enable.png" alt="arrow_left"></button>
              <button class="pagination-arrow-right"><img src="/static/img/arrow_right_disable.png" alt="arrow_right"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script defer src="{{ url_for('static', path='scriptPERSONAL.js') }}?v=12"></script>
    <script defer src="{{ url_for('static', path='scriptACTIONS.js') }}?v=1"></script>
  </body>
</html>
